name: Windows のインストーラを作る
description: >-
  NSIS のインストーラ（署名なし）を作り、静かに入れて同梱の hangar.cmd が動くことと、殻を起こすとサーバが応えることを見てから、静かに消す。
  ci と release の windows ジョブが同じ手順を使うためにここへまとめてある。
  呼ぶ前に checkout、Node 22、npm ci --ignore-scripts、Rust（target 入り）をそろえておく。
inputs:
  target:
    description: Rust の target（x86_64-pc-windows-msvc）。tauri build の --target に渡す。
    required: true
  extra-config:
    description: >-
      重ねる Tauri の設定（apps/desktop からの相対）。release の試しの版が、updater の endpoint を試しの道に替えるために渡す。
      空なら何も重ねない。ci からは渡さない。
    required: false
    default: ''
  signing-key:
    description: >-
      自動更新の署名鍵（minisign の秘密鍵、Tauri の TAURI_SIGNING_PRIVATE_KEY）。
      渡せば tauri.updater.conf.json を重ねて、インストーラの署名（.sig）も作る。ci からは渡さない。
    required: false
    default: ''
  signing-key-password:
    description: 署名鍵の合言葉（TAURI_SIGNING_PRIVATE_KEY_PASSWORD）。
    required: false
    default: ''
outputs:
  setup:
    description: できたインストーラのパス（リポジトリの根からの相対、区切りは /）。
    value: ${{ steps.find.outputs.setup }}
  sig:
    description: インストーラの署名（.sig）のパス。署名鍵を渡さなかったときは空。
    value: ${{ steps.find.outputs.sig }}
runs:
  using: composite
  steps:
    # server-dist は beforeBuildCommand（npm run bundle-server）が作る。UI の dist が先に要るので build を先に回す。
    # 束の target（win32-x64 の prebuild）は、bundle-server がこの機械の Node から決める。
    - name: UI と サーバをビルドする
      shell: pwsh
      run: npm run build
    # 置き場を先に空ける。target はキャッシュから戻るので、前の版のインストーラが残っていると 2 つになる。
    - name: インストーラを作る
      shell: pwsh
      env:
        TARGET: ${{ inputs.target }}
        EXTRA_CONFIG: ${{ inputs.extra-config }}
        TAURI_SIGNING_PRIVATE_KEY: ${{ inputs.signing-key }}
        TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ inputs.signing-key-password }}
      run: |
        Remove-Item -Recurse -Force -ErrorAction SilentlyContinue "apps/desktop/src-tauri/target/$env:TARGET/release/bundle/nsis"
        $extra = @()
        if ($env:EXTRA_CONFIG) { $extra += @('--config', $env:EXTRA_CONFIG) }
        if ($env:TAURI_SIGNING_PRIVATE_KEY) { $extra += @('--config', 'src-tauri/tauri.updater.conf.json') }
        else { Remove-Item Env:TAURI_SIGNING_PRIVATE_KEY, Env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD -ErrorAction SilentlyContinue }
        npm run tauri -w apps/desktop -- build --bundles nsis --target $env:TARGET @extra
    - name: インストーラの名前、大きさ、SHA-256
      id: find
      shell: pwsh
      env:
        TARGET: ${{ inputs.target }}
      run: |
        $dir = "apps/desktop/src-tauri/target/$env:TARGET/release/bundle/nsis"
        # 署名（*-setup.exe.sig）が隣にあっても数えないよう、名前の末尾で選ぶ。
        $files = @(Get-ChildItem $dir | Where-Object { $_.Name -like '*-setup.exe' })
        if ($files.Count -ne 1) { throw "NSIS のインストーラが 1 つでない（$($files.Count) 個）" }
        $f = $files[0]
        '{0}  {1:N1} MB  {2}' -f $f.Name, ($f.Length / 1MB), (Get-FileHash -Algorithm SHA256 $f.FullName).Hash
        Add-Content -Path $env:GITHUB_OUTPUT -Value "setup=$dir/$($f.Name)"
        if (Test-Path "$($f.FullName).sig") { Add-Content -Path $env:GITHUB_OUTPUT -Value "sig=$dir/$($f.Name).sig" }
    # 管理者権限なし（ユーザー単位）で静かに入る。入った先の同梱の hangar.cmd が、Node を見つけて cli.mjs を動かす。
    # 入れた先は %LOCALAPPDATA%\Hangar（NSIS のユーザー単位の既定）。レイアウトを決め打ちしすぎないよう、hangar.cmd は探して使う。
    # アプリ本体（殻）も一度起こし、同梱のサーバが /health に応えるところまで見てから止める。
    - name: 静かに入れ、同梱の hangar.cmd を動かし、静かに消す
      shell: pwsh
      env:
        SETUP: ${{ steps.find.outputs.setup }}
      run: |
        $p = Start-Process -FilePath (Resolve-Path $env:SETUP).Path -ArgumentList '/S' -Wait -PassThru
        if ($p.ExitCode -ne 0) { throw "インストーラが終了コード $($p.ExitCode) で終わった" }
        $dir = Join-Path $env:LOCALAPPDATA 'Hangar'
        if (-not (Test-Path $dir)) { Get-ChildItem $env:LOCALAPPDATA | Format-Table Name; throw "$dir に入っていない" }
        Get-ChildItem $dir | Format-Table Name, Length
        $cmd = Get-ChildItem $dir -Recurse -Filter hangar.cmd | Select-Object -First 1
        if (-not $cmd) { throw '同梱の hangar.cmd が入っていない' }
        # 殻が起動のたびに書くトーストの登録と絵を、殻を起こす前にここでも置く（殻が起きなくても消す側を確かめられるように）。
        # 消したあとに残っていないことと、利用者のデータには触れないことを、消したあとで見る。
        $appKey = 'HKCU:\Software\Classes\AppUserModelId\dev.agent-hangar.hangar'
        $clsidKey = 'HKCU:\Software\Classes\CLSID\{1CE6AB2A-D79D-49F4-88B0-5A9E624A75E4}'
        $home1 = Join-Path $env:USERPROFILE '.agent-hangar'
        New-Item -Path $appKey -Force | Out-Null
        New-Item -Path "$clsidKey\LocalServer32" -Force | Out-Null
        New-Item -ItemType Directory -Path $home1 -Force | Out-Null
        Set-Content -Path (Join-Path $home1 'notify-icon.png') -Value 'x'
        Set-Content -Path (Join-Path $home1 'ci-keep.txt') -Value 'x'
        $out = & $cmd.FullName --help 2>&1 | Out-String
        $out
        if ($LASTEXITCODE -ne 0 -or $out -notmatch 'setup') { throw "hangar.cmd --help が動かない（終了コード ${LASTEXITCODE}）" }
        # 入れた殻を起こし、殻が同梱のサーバを Node で起こして 127.0.0.1:4177 の /health が応えるまで待つ。
        # 殻は resource_dir（Windows では \\?\ 付きの verbatim の形）から server.mjs のパスを作って Node に渡す。
        # この経路は hangar.cmd では通らず、rc.1 は Node 22.20 以降でここが落ちて起動しなかった。
        # 既に誰かが 4177 で応えていると、殻はそれを採って自分のサーバを起こさないので、先に空いていることを見る。
        $health = 'http://127.0.0.1:4177/health'
        $busy = $false
        try { Invoke-RestMethod -Uri $health -TimeoutSec 2 | Out-Null; $busy = $true } catch { }
        if ($busy) { throw '殻を起こす前から 4177 が応えている' }
        $exe = Get-ChildItem $dir -Filter *.exe | Where-Object { $_.Name -ne 'uninstall.exe' } | Select-Object -First 1
        if (-not $exe) { throw '殻の exe が入っていない' }
        # 殻は Node を公式の入れ先（%ProgramFiles%\nodejs）から PATH より先に探すので、放っておくとランナーに初めから入っている Node を使う。
        # その版が 22.20 より古いと、verbatim のパスで落ちる回帰をこの段では捕まえられない。
        # 一時のホームの settings.json の nodePath で setup-node の Node（22 の最新）を指す。利用者のデータの置き場は使わない。
        $node = (Get-Command node).Source
        $tmpHome = Join-Path $env:RUNNER_TEMP 'hangar-home'
        New-Item -ItemType Directory -Path $tmpHome -Force | Out-Null
        @{ nodePath = $node } | ConvertTo-Json | Set-Content -Path (Join-Path $tmpHome 'settings.json') -Encoding utf8
        $env:HANGAR_HOME = $tmpHome
        $app = Start-Process -FilePath $exe.FullName -PassThru
        Remove-Item Env:HANGAR_HOME
        $ok = $false
        try {
          $deadline = (Get-Date).AddSeconds(90)
          while ((Get-Date) -lt $deadline -and -not $app.HasExited) {
            try { if ((Invoke-RestMethod -Uri $health -TimeoutSec 2).ok) { $ok = $true; break } } catch { }
            Start-Sleep -Seconds 1
          }
        } finally {
          # 殻を止める。サーバと孫は殻のジョブに入っていて、殻が消えるとジョブごと止まる（winjob.rs）。
          if (-not $app.HasExited) { Stop-Process -Id $app.Id -Force }
          $app.WaitForExit(15000) | Out-Null
          $gone = (Get-Date).AddSeconds(20)
          while ((Get-Date) -lt $gone -and (Get-Process | Where-Object { $_.Path -like "$dir\*" })) { Start-Sleep -Milliseconds 500 }
          $log = Join-Path $tmpHome 'desktop.log'
          if (Test-Path $log) { Get-Content $log -Tail 40 }
        }
        if (-not $ok) { throw "殻を起こしても $health が応えなかった（殻の終了: $($app.HasExited)）" }
        # 殻が実際に使った Node を desktop.log の起動の行から読み、版を印字して 22.20 以上であることを確かめる。
        $m = [regex]::Match((Get-Content $log -Raw), '\[desktop\] node (.+) server ')
        if (-not $m.Success) { throw '殻が使った Node が desktop.log に出ていない' }
        $used = $m.Groups[1].Value.Trim()
        $v = (& $used --version | Out-String).Trim()
        "殻が使った Node: $used $v"
        if ($used -ne $node) { throw "殻が nodePath の Node を使っていない（使ったのは ${used}、指したのは ${node}）" }
        if ([version]$v.TrimStart('v') -lt [version]'22.20.0') { throw "殻が使った Node $v は 22.20 より古く、verbatim のパスの回帰を捕まえられない" }
        # _?= を付けると、消す側が自分を写さずその場で動き、終わるまで待てる。
        $u = Start-Process -FilePath (Join-Path $dir 'uninstall.exe') -ArgumentList "/S _?=$dir" -Wait -PassThru
        if ($u.ExitCode -ne 0) { throw "アンインストーラが終了コード $($u.ExitCode) で終わった" }
        # アンインストールのフックが、トーストの登録と絵を消す。利用者のデータ（.agent-hangar の中のほかのもの）は消さない。
        if (Test-Path $appKey) { throw 'アンインストール後に AppUserModelId の登録が残っている' }
        if (Test-Path $clsidKey) { throw 'アンインストール後に COM の口の CLSID の登録が残っている' }
        if (Test-Path (Join-Path $home1 'notify-icon.png')) { throw 'アンインストール後に notify-icon.png が残っている' }
        if (-not (Test-Path (Join-Path $home1 'ci-keep.txt'))) { throw 'アンインストールが利用者のデータを消した' }
        Remove-Item (Join-Path $home1 'ci-keep.txt') -Force
