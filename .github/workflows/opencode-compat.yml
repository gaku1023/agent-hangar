name: opencode-compat
on:
  # 週に 1 度（月曜 0:30 UTC。claude-compat と少しずらす）と、手動で走らせる。
  schedule:
    - cron: '30 0 * * 1'
  workflow_dispatch:
# 既定の権限に頼らず、読み取りだけを渡す。
permissions:
  contents: read
# 手動と定期が重なっても、どちらも最後まで走らせる。照合は外の版を見るだけで、押し合うものが無い。
concurrency:
  group: opencode-compat
  cancel-in-progress: false
jobs:
  compare:
    runs-on: ubuntu-latest
    # npm の取得が固まったときの上限。ふつうは数分で終わる。
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      # 最新の 2.x の opencode を npm から入れる（npm の名前は @opencode/cli。opencode-ai は 1.x で、API がまったく別物）。
      # postinstall が Linux の本体を置く。--version と --help と、模擬のプロバイダーで動かす serve に認証は要らない。
      - name: 最新の 2.x の opencode を入れる
        run: |
          npm install -g @opencode/cli@2
          opencode --version
      # 照合の試験は better-sqlite3 も node-pty も読まないので、ネイティブのビルドを飛ばして入れる。
      - run: npm ci --ignore-scripts
      # --help が最も新しい見本と違うか、hangar が使う serve の道の答えの形が変わると落ちる。見本を採り直す合図である（npm run capture-opencode-fixtures）。
      # serve は試しの置き場（XDG_*_HOME を一時ディレクトリへ）と空の環境で 1 本だけ起こし、LLM は呼ばない（OpenAI 互換の模擬を手元に立てる）。
      - name: 最も新しい見本と hangar が使う道を突き合わせる
        run: npx vitest run --project server packages/server/test/opencodeLive.test.ts
        env:
          HANGAR_LIVE_OPENCODE: '1'
