name: release
on:
  push:
    tags: ['v*']
# 既定の権限に頼らず、何も渡さない。
# 書き込みが要るのは、Release を作る macos ジョブと、そこへ Windows のインストーラを添える windows-upload ジョブだけなので、権限はその 2 つに置く。
# Release を作るのは macos ジョブだけにする。
# windows ジョブは書き込みなしでインストーラを作って artifact に置き、windows-upload が macos の後でそれを同じ Release に添える。
permissions: {}
# 同じタグを二重に走らせない。
# 走っている途中で止めると資産が半端なまま Release に載りかねないので、先に走っているほうを優先する。
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  macos:
    runs-on: macos-latest
    permissions:
      contents: write
    # Rust のビルドがキャッシュ外れで長引いたときの上限。
    # ci の desktop ジョブと違い、こちらは npm の試験と .app のビルドも含むので長めに取る。
    timeout-minutes: 60
    strategy:
      matrix:
        include:
          # Apple silicon のみ。
          # Intel を足すときは runs-on が x86_64 のランナーである行を加える。
          - target: aarch64-apple-darwin
            arch: arm64
    steps:
      - uses: actions/checkout@v7
      - name: タグと tauri.conf.json の版が一致することを確かめる
        run: |
          v="$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")"
          if [ "v$v" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match tauri.conf.json version $v" >&2
            exit 1
          fi
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      # dtolnay/rust-toolchain@stable は --profile minimal で入るため rustfmt と clippy を含まない。
      # このワークフローは cargo fmt も cargo clippy も使わないので components は指定しない。
      # どちらも ci の desktop ジョブが見ている。
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # npx は入っていなければ取りに行くので、ここで動く版が package-lock.json の外から来うる。
      # workspace の script を通せば、動くのは npm ci が入れた @tauri-apps/cli だけになる。
      - name: .app をビルドする（beforeBuildCommand が server-dist を作る）
        run: npm run tauri -- build --target ${{ matrix.target }}
        working-directory: apps/desktop
      # 署名も公証もしない。
      # ditto で作った zip は Finder の展開でも .app の属性が保たれる。
      # 配布物は dmg が主、zip が従（自動更新と予備）。
      # dmg は tauri の dmg ターゲットでは作らず、ここで出来上がった .app から作る（理由は make-dmg.sh の頭）。
      - name: dmg と zip と checksum
        run: |
          cd apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/macos
          name="Hangar-${GITHUB_REF_NAME}-macos-${{ matrix.arch }}"
          bash "$GITHUB_WORKSPACE/apps/desktop/scripts/make-dmg.sh" Hangar.app "$name.dmg"
          shasum -a 256 "$name.dmg" > "$name.dmg.sha256"
          cat "$name.dmg.sha256"
          ditto -c -k --sequesterRsrc --keepParent Hangar.app "$name.zip"
          shasum -a 256 "$name.zip" > "$name.zip.sha256"
          cat "$name.zip.sha256"
          echo "ASSET_DIR=$PWD" >> "$GITHUB_ENV"
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            ${{ env.ASSET_DIR }}/*.dmg
            ${{ env.ASSET_DIR }}/*.dmg.sha256
            ${{ env.ASSET_DIR }}/*.zip
            ${{ env.ASSET_DIR }}/*.zip.sha256
          # 資産が 1 つも付かない Release が黙って公開されるのを防ぐ。
          fail_on_unmatched_files: true
          generate_release_notes: true
  # Windows 11 の x64 だけ。署名はしない（利用者の決定）。
  # 作る手順は ci の windows ジョブと同じ composite action（.github/actions/windows-installer）で、静かに入れて同梱の hangar.cmd が動くところまで見る。
  # npm test は回さない。psmux を相手にする試験は ci の windows ジョブが main の同じコミットで回している。
  # タグと tauri.conf.json の版の照合は macos ジョブが行い、合わなければ windows-upload まで進まない。
  windows:
    runs-on: windows-latest
    permissions:
      contents: read
    # ci の windows ジョブから npm test と cargo の検査を除いた分。Rust の release ビルドがキャッシュ外れで長引いたときの上限。
    timeout-minutes: 60
    strategy:
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            arch: x64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      # ネイティブモジュールは Windows 向けの prebuild を同梱しているので、スクリプト無しで入れる（ci の windows ジョブと同じ）。
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - id: installer
        uses: ./.github/actions/windows-installer
        with:
          target: ${{ matrix.target }}
      # .sha256 は macOS の zip と同じ「ハッシュ、空白 2 つ、名前」の形にして、shasum -a 256 -c でも確かめられるようにする。
      - name: 名前を付けて checksum を作る
        shell: pwsh
        env:
          SETUP: ${{ steps.installer.outputs.setup }}
          ARCH: ${{ matrix.arch }}
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'release-assets'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $name = "Hangar-$env:GITHUB_REF_NAME-windows-$env:ARCH-setup.exe"
          Copy-Item -Path $env:SETUP -Destination (Join-Path $out $name)
          $hash = (Get-FileHash -Algorithm SHA256 (Join-Path $out $name)).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText((Join-Path $out "$name.sha256"), "$hash  $name`n")
          Get-Content (Join-Path $out "$name.sha256")
          Add-Content -Path $env:GITHUB_ENV -Value "ASSET_DIR=$out"
      - uses: actions/upload-artifact@v7
        with:
          name: windows-${{ matrix.arch }}
          path: ${{ env.ASSET_DIR }}
          if-no-files-found: error
          retention-days: 1
  # macos ジョブが作った Release に、windows ジョブのインストーラを添える。
  # needs で macos の後に回すので、Release を作る側は macos ジョブ 1 つに決まり、二重に作ることも競うこともない。
  # gh release upload は Release が無ければ失敗するので、ここで新しく作ることもない。
  # --clobber は、このジョブだけを再実行したときに同じ名前の資産を上書きするためである。
  windows-upload:
    needs: [macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: windows-*
          path: assets
          merge-multiple: true
      - name: Release に添える
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(assets/*-setup.exe assets/*-setup.exe.sha256)
          if [ "${#files[@]}" -lt 2 ]; then
            echo "Windows のインストーラか checksum が無い" >&2
            ls -la assets >&2
            exit 1
          fi
          gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber --repo "$GITHUB_REPOSITORY"
