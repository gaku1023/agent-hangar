name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}
# 実験 X3（マージしない）：Windows の npm test を、vitest の走らせ方を変えて全部回し、所要を比べる。
# 基準は X1（#262）の windows ジョブの npm test。
jobs:
  win-vitest:
    strategy:
      fail-fast: false
      matrix:
        variant:
          - name: threads
            args: --pool=threads
          - name: no-isolate
            args: --no-isolate
          - name: workers-4
            args: --maxWorkers=4
    name: win-${{ matrix.variant.name }}
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: psmux を入れる
        shell: pwsh
        env:
          PSMUX_VERSION: '3.3.8'
          PSMUX_SHA256: 1ad127ba937194a890b933a73d9b023e297bd73dc742abd841bf159984c2effe
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'psmux.zip'
          $dir = Join-Path $env:RUNNER_TEMP 'psmux'
          Invoke-WebRequest -Uri "https://github.com/psmux/psmux/releases/download/v$env:PSMUX_VERSION/psmux-v$env:PSMUX_VERSION-windows-x64.zip" -OutFile $zip
          $got = (Get-FileHash -Algorithm SHA256 $zip).Hash
          if ($got -ne $env:PSMUX_SHA256.ToUpper()) { throw "psmux の SHA-256 が合わない: $got" }
          Expand-Archive -Path $zip -DestinationPath $dir
          Add-Content -Path $env:GITHUB_PATH -Value $dir
          & (Join-Path $dir 'psmux.exe') -V
      - run: node -e "console.log(require('os').availableParallelism())"
      - run: npm test -- ${{ matrix.variant.args }}
