name: ci
on:
  push:
    branches: [main]
  pull_request:
# 既定の権限に頼らず、読み取りだけを渡す。
# public のリポジトリなので、ここを明記しないと設定次第で書き込みの持ち主が走る。
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
  desktop:
    runs-on: macos-latest
    # Rust のビルドがキャッシュ外れで長引いたときの上限。
    # キャッシュに当たれば数分で終わる。
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: cargo fmt --check
        working-directory: apps/desktop/src-tauri
      - run: cargo test
        working-directory: apps/desktop/src-tauri
