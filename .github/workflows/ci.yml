name: ci
on:
  push:
    branches: [main]
  pull_request:
# 既定の権限に頼らず、読み取りだけを渡す。
# public のリポジトリなので、ここを明記しないと設定次第で書き込みの持ち主が走る。
permissions:
  contents: read
# 同じ枝に続けて押したとき、古い実行を畳む。
# main だけは畳まない。畳むと、その手前のコミットが緑だったかどうかが記録に残らない。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  check:
    runs-on: ubuntu-latest
    # 試験が固まったときの上限。ふつうは数分で終わる。
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      # tmux を入れないと、tmux に依存する試験 33 件が describe.skipIf で黙って飛ぶ。
      # 飛んでいたのは起動、寿命、resume と fork、トークンを argv に載せない、run ごとの秘密といった要所である。
      # tmux -V を出すのは、入ったことを実行の記録に残して skipIf が解けたと言い切れるようにするためである。
      - name: tmux を入れる
        run: |
          sudo apt-get update
          sudo apt-get install -y tmux
          tmux -V
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
  windows:
    runs-on: windows-latest
    # 試験が固まったときの上限。npm test に約 9 分、Rust のビルドがキャッシュ外れで数分、
    # 配布物のビルド（release の Rust と NSIS）にさらに数分から十数分かかる。
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      # better-sqlite3 は入れるたびに node-gyp でビルドを始める。ネイティブモジュールは Windows 向けの prebuild を同梱しているので、
      # スクリプト無しで入れる。Linux の node-pty には prebuild が無くビルドが要るので、これは Windows のジョブでだけ行う。
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      # psmux を入れないと、psmux を相手にする試験（tmux/psmux.win.test.ts）が describe.skipIf で黙って飛ぶ。
      # 取得元は公式のリリースの zip で、版と SHA-256 を固定する。
      # winget はランナーに入っていると限らず、cargo install はビルドで数分かかるので使わない。
      # 版を上げるときは、この 2 つの値と、psmux.win.test.ts の隔離の試験を合わせて見直す。
      # zip には psmux.exe、pmux.exe、tmux.exe が入っている。hangar は psmux を先に探す。
      - name: psmux を入れる
        shell: pwsh
        env:
          PSMUX_VERSION: '3.3.8'
          PSMUX_SHA256: 1ad127ba937194a890b933a73d9b023e297bd73dc742abd841bf159984c2effe
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'psmux.zip'
          $dir = Join-Path $env:RUNNER_TEMP 'psmux'
          Invoke-WebRequest -Uri "https://github.com/psmux/psmux/releases/download/v$env:PSMUX_VERSION/psmux-v$env:PSMUX_VERSION-windows-x64.zip" -OutFile $zip
          $got = (Get-FileHash -Algorithm SHA256 $zip).Hash
          if ($got -ne $env:PSMUX_SHA256.ToUpper()) { throw "psmux の SHA-256 が合わない: $got" }
          Expand-Archive -Path $zip -DestinationPath $dir
          Add-Content -Path $env:GITHUB_PATH -Value $dir
          & (Join-Path $dir 'psmux.exe') -V
      - run: npm test
      # 殻（Tauri、Rust）が Windows で組み上がることを見る。窓や通知の振る舞いまでは見ない（段 6 の 6-2）。
      # windows-latest に Rust は入っているが、版と components をここで決める。
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: cargo check --all-targets
        working-directory: apps/desktop/src-tauri
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: apps/desktop/src-tauri
      - run: cargo test
        working-directory: apps/desktop/src-tauri
      # 配布物（NSIS のインストーラ）を作り、入れて、同梱の hangar.cmd が動くところまで見る（段 6 の 6-8）。
      # 署名はしない（利用者の決定）。Release には上げず、この実行の artifact に 7 日だけ残す。
      # server-dist は beforeBuildCommand（npm run bundle-server）が作る。UI の dist が先に要るので build を先に回す。
      - run: npm run build
      - name: インストーラを作る
        run: npm run tauri -w apps/desktop -- build --bundles nsis
      - name: インストーラの名前、大きさ、SHA-256
        shell: pwsh
        run: |
          $files = Get-ChildItem apps/desktop/src-tauri/target/release/bundle/nsis -Filter '*-setup.exe'
          if (-not $files) { throw 'NSIS のインストーラができていない' }
          foreach ($f in $files) {
            '{0}  {1:N1} MB  {2}' -f $f.Name, ($f.Length / 1MB), (Get-FileHash -Algorithm SHA256 $f.FullName).Hash
          }
      # 管理者権限なし（ユーザー単位）で静かに入る。入った先の同梱の hangar.cmd が、Node を見つけて cli.mjs を動かす。
      # 入れた先は %LOCALAPPDATA%\Hangar（NSIS のユーザー単位の既定）。レイアウトを決め打ちしすぎないよう、hangar.cmd は探して使う。
      # アプリ本体は起動しない（窓を持つので CI では動かさない）。
      - name: 静かに入れ、同梱の hangar.cmd を動かし、静かに消す
        shell: pwsh
        run: |
          $setup = Get-ChildItem apps/desktop/src-tauri/target/release/bundle/nsis -Filter '*-setup.exe' | Select-Object -First 1
          $p = Start-Process -FilePath $setup.FullName -ArgumentList '/S' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "インストーラが終了コード $($p.ExitCode) で終わった" }
          $dir = Join-Path $env:LOCALAPPDATA 'Hangar'
          if (-not (Test-Path $dir)) { Get-ChildItem $env:LOCALAPPDATA | Format-Table Name; throw "$dir に入っていない" }
          Get-ChildItem $dir | Format-Table Name, Length
          $cmd = Get-ChildItem $dir -Recurse -Filter hangar.cmd | Select-Object -First 1
          if (-not $cmd) { throw '同梱の hangar.cmd が入っていない' }
          $out = & $cmd.FullName --help 2>&1 | Out-String
          $out
          if ($LASTEXITCODE -ne 0 -or $out -notmatch 'setup') { throw "hangar.cmd --help が動かない（終了コード $LASTEXITCODE）" }
          # _?= を付けると、消す側が自分を写さずその場で動き、終わるまで待てる。
          $u = Start-Process -FilePath (Join-Path $dir 'uninstall.exe') -ArgumentList "/S _?=$dir" -Wait -PassThru
          if ($u.ExitCode -ne 0) { throw "アンインストーラが終了コード $($u.ExitCode) で終わった" }
      - uses: actions/upload-artifact@v7
        with:
          name: Hangar-windows-x64-setup
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 7
  desktop:
    runs-on: macos-latest
    # Rust のビルドがキャッシュ外れで長引いたときの上限。
    # キャッシュに当たれば数分で終わる。
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: cargo fmt --check
        working-directory: apps/desktop/src-tauri
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: apps/desktop/src-tauri
      - run: cargo test
        working-directory: apps/desktop/src-tauri
      - run: npm ci
      # 同梱サーバの作り方を確かめる試験は Apple silicon でしか走らない。
      # ubuntu の check では飛ぶので、走る場所はこの macOS のジョブだけである。
      - name: 同梱サーバの試験
        run: npm test -- --project desktop
