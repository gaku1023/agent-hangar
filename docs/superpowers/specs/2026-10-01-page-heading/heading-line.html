ge) ? ' aria-current=\"page\"' : ''}>${I(r)}<span class=\"nav-label\">${l}<\/span><\/a>`;\n  if (S.mode === 'new' && S.logo !== 'side') {\n    // ロゴはヘッダーへ。開閉のボタンは、開いた帯ではホームの行の右端に、畳んだ帯では帯の一番上に置く。\n    if (S.side === 'collapsed') return `<nav class=\"sidebar\" aria-label=\"主ナビゲーション\"><div class=\"sidebar-top\">${toggleBtn()}<\/div>${NAV.map(item).join('')}<\/nav>`;\n    return `<nav class=\"sidebar no-top\" aria-label=\"主ナビゲーション\"><div class=\"nav-row\">${item(NAV[0])}${toggleBtn()}<\/div>${NAV.slice(1).map(item).join('')}<\/nav>`;\n  }\n  return `<nav class=\"sidebar\" aria-label=\"主ナビゲーション\"><div class=\"sidebar-top\"><a class=\"brand\" href=\"#\" data-go=\"home\"><img class=\"brand-mark\" src=\"__LOGO__\" width=\"44\" height=\"44\" alt=\"\"><span class=\"brand-word\">Hangar<\/span><\/a>${toggleBtn()}<\/div>${NAV.map(item).join('')}<\/nav>`;\n}\n\nfunction headerEnd() {\n  return `<span class=\"sync\" data-state=\"idle\"><span class=\"sync-dot\"><\/span><a class=\"mono sync-label faint\" href=\"#\">同期 2 分前<\/a><button class=\"btn btn-sm sync-action\">今すぐ同期<\/button><button class=\"btn btn-sm sync-action\">一時停止<\/button><\/span>`\n    + `<span class=\"gauges\"><span class=\"gauge\"><span class=\"gauge-key\">5h<\/span><span class=\"gauge-bar\"><span class=\"gauge-fill\" style=\"width:42%\"><\/span><\/span><span class=\"gauge-num mono\">42%<\/span><\/span><span class=\"gauge\"><span class=\"gauge-key\">7d<\/span><span class=\"gauge-bar\"><span class=\"gauge-fill\" style=\"width:18%\"><\/span><\/span><span class=\"gauge-num mono\">18%<\/span><\/span><span class=\"faint gauge-updated\">最終更新 3 分前<\/span><\/span>`\n    + `<button class=\"btn btn-primary new-session\">${I('add')}<span class=\"btn-label\">新規セッション<\/span><\/button>`;\n}\nconst searchBits = `<input class=\"input search-box\" type=\"search\" placeholder=\"セッションを検索（/）\"><kbd class=\"search-kbd\">⌘K<\/kbd><button class=\"btn search-icon\">${I('search')}<\/button>`;\n\nfunction header() {\n  if (S.mode === 'old') {\n    const cs = crumbs();\n    const c = cs.map((c, i) => `<span class=\"crumb ${i === cs.length - 1 ? 'crumb-last' : 'crumb-prev'}\">${i > 0 ? '<span class=\"faint crumb-sep\"> / <\/span>' : ''}${c.go ? `<a href=\"#\" ${goAttr(c)}>${c.label}<\/a>` : `<b>${c.label}<\/b>`}<\/span>`).join('');\n    return `<header class=\"header\"><div class=\"crumbs\">${c}<\/div>${searchBits}<span class=\"spacer\"><\/span>${headerEnd()}<\/header>`;\n  }\n  return `<header class=\"header hd-new\" data-right=\"${S.right}\">${hdBrand()}<div class=\"hd-row\">${searchBits}<span class=\"spacer\"><\/span><span class=\"hd-end\">${headerEnd()}<\/span><\/div><\/header>`;\n}\n\n/* 新案の見出し。parent は { label, go, pid }、なければ null。row は見出しの行の残り（ボタンなど）。 */\nfunction ph(title, parent, rowExtra = '', opts = {}) {\n  const lead = opts.lead ?? '';\n  const titleCls = opts.titleCls ?? 'ph-title';\n  let line = '';\n  let inline = '';\n  if (parent && S.parent === 'above') line = `<div class=\"ph-parent\"><a href=\"#\" ${goAttr(parent)}>${parent.label}<\/a><span>›<\/span><\/div>`;\n  if (parent && S.parent === 'back') line = `<div class=\"ph-parent back\"><a href=\"#\" ${goAttr(parent)}>${I('back')}${parent.label}<\/a><\/div>`;\n  if (parent && S.parent === 'inline') inline = `<a class=\"ph-inline\" href=\"#\" ${goAttr(parent)}>${parent.label}<\/a><span class=\"ph-inline-sep\">›<\/span>`;\n  if (!line && S.reserve === 'yes' && S.parent !== 'inline') line = '<div class=\"ph-parent\"><\/div>';\n  const icon = opts.icon ? `<span class=\"ph-icon\">${I(opts.icon)}<\/span>` : '';\n  const sub = opts.sub ? `<div class=\"ph-sub\">${opts.sub}<\/div>` : '';\n  return `<div class=\"ph\">${line}<div class=\"ph-row ${opts.rowCls ?? ''}\">${icon}${lead}${inline}<h1 class=\"${titleCls}\">${title}<\/h1>${rowExtra}<\/div>${sub}<\/div>`;\n}\n\nfunction rows(list, variant, height) {\n  return `<div class=\"rows-host\"><div class=\"list\"><div class=\"list-scroll\" style=\"height:${height}px;overflow:hidden\">` + list.map((r) => `<div class=\"row row-2\" data-go=\"session\" data-sid=\"${r.id}\"><span class=\"dot\" data-status=\"${r.live ?? 'ended'}\"><\/span><span class=\"row-main\"><span class=\"row-name\">${r.name}${variant === 'search' ? `<span class=\"row-proj\">${proj(r.proj).name}<\/span>` : ''}<\/span><span class=\"row-sub\"><span class=\"row-text\">${r.one}<\/span><\/span><\/span><span class=\"row-side\">${variant === 'project' ? '<span class=\"row-meta\"><span class=\"mono\">opus-5.5 · high<\/span><span>変更 6<\/span><\/span>' : ''}<time class=\"mono muted\">${r.when}<\/time><\/span><\/div>`).join('') + '<\/div><\/div><\/div>';\n}\n\nfunction pageHome() {\n  const head = S.mode === 'new' ? ph('ホーム', null, '', { icon: 'home', sub: '要対応 1 · 実行中 2' }) : '';\n  return `<div class=\"screen home\">${head}\n    <section><h2 class=\"home-label\">要対応<span class=\"home-count\">1<\/span><\/h2>\n      <div class=\"ask-card\"><span class=\"dot\" data-status=\"waiting\"><\/span><div class=\"ask-body\"><div class=\"ask-title\"><b>保持期間の通知<\/b> <span class=\"faint\">· agent-hangar · 5 分待っている<\/span><\/div><div class=\"ask-q\">確認ダイアログの既定を 1 年にしてよいですか？<\/div><\/div><button class=\"btn btn-primary\">答える<\/button><\/div><\/section>\n    <section><h2 class=\"home-label\">実行中<span class=\"home-count\">2<\/span><\/h2><div class=\"live-grid\">\n      ${[SESSIONS[0], SESSIONS[1]].map((s) => `<div class=\"live-card\" data-go=\"session\" data-sid=\"${s.id}\"><div class=\"live-head\"><span class=\"dot\" data-status=\"${s.live}\"><\/span><span class=\"live-name\">${s.name}<\/span><span class=\"live-elapsed mono\">12 分<\/span><\/div><div class=\"live-meta\">agent-hangar · opus-5.5<\/div><div class=\"live-act mono\"><i>Edit<\/i> packages/ui/src/views/Header.tsx<\/div><div class=\"live-ctx\">文脈<span class=\"gauge-bar\"><span class=\"gauge-fill\" style=\"width:38%\"><\/span><\/span>38%<\/div><\/div>`).join('')}\n    <\/div><\/section>\n    <div class=\"home-two\"><section><h2 class=\"home-label\">最近<\/h2>${rows(SESSIONS.slice(2, 6), 'recent', 224)}<\/section>\n      <section><h2 class=\"home-label\">プロジェクト<\/h2><div class=\"list pj-list\">${PROJECTS.map((p) => `<button class=\"pj-row\" data-go=\"project\" data-pid=\"${p.id}\"><span class=\"pj-dot\" data-status=\"active\"><\/span><span class=\"pj-name\">${p.name}<\/span><span class=\"pj-counts\">実行中 ${p.running} · TODO ${p.todo}<\/span><\/button>`).join('')}<\/div><\/section><\/div>\n  <\/div>`;\n}\n\nfunction pageProjects() {\n  const extra = `<input class=\"input\" placeholder=\"名前で絞る\"><span class=\"spacer\"><\/span><button class=\"btn\">アーカイブを表示（3）<\/button>`;\n  const head = S.mode === 'new' ? ph('プロジェクト', null, extra, { icon: 'projects', sub: 'active 4 · paused 0 · アーカイブ 3' })\n    : `<div style=\"display:flex;gap:12px;align-items:center;margin-bottom:12px\"><h1 class=\"h1\" style=\"margin:0\">プロジェクト<\/h1>${extra}<\/div>`;\n  const cards = PROJECTS.map((p) => `<div class=\"card-slot\"><div class=\"card\" data-go=\"project\" data-pid=\"${p.id}\"><div style=\"display:flex;align-items:center;gap:8px\"><span class=\"card-title\" style=\"flex:1\">${p.name}<\/span><span class=\"pill-status\">active<\/span><\/div><div class=\"mono faint\" style=\"overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">${p.path}<\/div><div class=\"muted\" style=\"overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">${p.last}<\/div><div class=\"faint\" style=\"display:flex;gap:12px\"><span>${p.when}<\/span>${p.running ? `<span>実行中 ${p.running}<\/span>` : ''}${p.todo ? `<span>TODO ${p.todo}<\/span>` : ''}<\/div><div class=\"card-foot\"><span class=\"spacer\"><\/span><button class=\"btn\">${I('add')}ここで新規<\/button><\/div><\/div><\/div>`).join('');\n  return `<div class=\"screen\">${head}<section><div class=\"section-head\"><h2 class=\"h2\">active<\/h2><span class=\"faint\">4<\/span><\/div><div class=\"cards\">${cards}<\/div><\/section><section><div class=\"section-head\"><h2 class=\"h2\">paused<\/h2><span class=\"faint\">0<\/span><\/div><div class=\"faint\" style=\"padding:4px 0 8px\">なし<\/div><\/section><\/div>`;\n}\n\nfunction pageProject() {\n  const p = proj(S.pid);\n  const extra = `<span class=\"pill-status\">active<\/span><span class=\"spacer\"><\/span><button class=\"btn btn-primary\">${I('add')}新規セッション<\/button><button class=\"btn\">${I('openEditor')}VS Code で開く<\/button><button class=\"btn\">${I('openTerminal')}ターミナルで開く<\/button><button class=\"btn\">${I('paneClose')}<\/button>`;\n  const head = S.mode === 'new' ? ph(p.name, { label: 'プロジェクト', go: 'projects' }, extra, { icon: 'projects', sub: `<span class=\"mono\">${p.path}<\/span>` })\n    : `<div class=\"project-head\"><h1 class=\"h1\" style=\"margin:0\">${p.name}<\/h1>${extra}<\/div>`;\n  const list = SESSIONS.filter((s) => s.proj === p.id);\n  return `<div class=\"screen project-screen\" data-rail=\"closed\"><div class=\"project-main\">${head}<div class=\"mono faint project-path\">${p.path}<\/div>${rows(list.length ? list : SESSIONS.slice(0, 1), 'project', 392)}<\/div><\/div>`;\n}\n\nfunction pageSessions() {\n  const count = '<span class=\"faint mono sessions-count ph-count\">128 件<\/span>';\n  const head = S.mode === 'new' ? ph('セッション', null, count, { icon: 'sessions', sub: '128 件 · 実行中 2' }) : `<h1 class=\"h1 sessions-head\">セッション<span class=\"faint mono sessions-count\">128 件<\/span><\/h1>`;\n  return `<div class=\"screen sessions-screen\">${head}<div class=\"sessions-keyword\"><input class=\"input\" placeholder=\"キーワード（空なら全件）\"><\/div>\n    <div class=\"sessions-filters\"><button class=\"btn\">すべてのプロジェクト<\/button><span class=\"fake-seg\"><span class=\"on\">全期間<\/span><span>今日<\/span><span>7 日<\/span><span>30 日<\/span><\/span><span class=\"fake-seg\"><span class=\"on\">すべて<\/span><span>実行中<\/span><span>終了<\/span><\/span><input class=\"input\" placeholder=\"触ったファイル\"><\/div>\n    ${rows(SESSIONS, 'search', 392)}<\/div>`;\n}\n\nfunction pageSession() {\n  const s = SESSIONS.find((x) => x.id === S.sid);\n  const p = proj(s.proj);\n  const dot = `<span class=\"dot\" data-status=\"${s.live ?? 'ended'}\"><\/span>`;\n  const btns = `<span class=\"session-oneliner\">${s.one}<\/span>${s.live ? `<button class=\"btn\">${I('openTerminal')}ターミナルで開く<\/button><button class=\"btn\">${I('stop')}停止<\/button>` : ''}<button class=\"btn\"${s.live ? ' disabled' : ''}>${I('resume')}再開<\/button><button class=\"btn\">${I('fork')}フォーク<\/button><button class=\"btn\">${I('openEditor')}VS Code で開く<\/button>`;\n  const hero = S.mode === 'new'\n    ? ph(s.name, { label: p.name, go: 'project', pid: p.id }, btns, { lead: dot, rowCls: 'session-hero', titleCls: 'session-name', icon: 'sessions', sub: s.one })\n    : `<div class=\"session-hero\">${dot}<h1 class=\"session-name\">${s.name}<\/h1>${btns}<\/div>`;\n  return `<div class=\"screen session-page\">${hero}\n    <div class=\"chips\">${s.live ? '<span class=\"chip\">作業中 · 12 分<\/span>' : ''}<a class=\"chip\" href=\"#\" data-go=\"project\" data-pid=\"${p.id}\">${p.name}<\/a><span class=\"chip mono\">opus-5.5 · high<\/span><span class=\"chip gauge-wrap\"><span class=\"faint\">コンテキスト<\/span><span class=\"gauge-bar\"><span class=\"gauge-fill\" style=\"width:38%\"><\/span><\/span><\/span><span class=\"chip mono\">$1.84<\/span><span class=\"chip\">変更 6<\/span><\/div>\n    <div class=\"session-facts faint mono\"><span>cwd ${p.path}<\/span><span>ターン 14<\/span><span>開始 14:02<\/span><\/div>\n    <div class=\"term\"><div class=\"t-dim\">&gt; ヘッダーの左上の文字を本文の見出しへ移したい<\/div><div><span class=\"t-tool\">● Read<\/span> packages/ui/src/views/Header.tsx<\/div><div><span class=\"t-tool\">● Read<\/span> packages/ui/src/presenters/shell.ts<\/div><div>パンくずの幅がページごとに違うため、検索欄が左右に動いています。<\/div><div><span class=\"t-tool\">● Edit<\/span> packages/ui/src/views/Header.tsx<\/div><div class=\"t-dim\">  ⎿ 12 行を削除、4 行を追加<\/div><\/div>\n  <\/div>`;\n}\n\nfunction pageSettings() {\n  const head = S.mode === 'new' ? ph('設定', null, '', { icon: 'settings', sub: 'この PC の hangar の設定' }) : '<h1 class=\"h1\">設定<\/h1>';\n  return `<div class=\"screen settings-screen\" style=\"max-width:720px\">${head}\n    <section><h2 class=\"h2\">ワークスペース<\/h2><div style=\"display:flex;gap:8px\"><input class=\"input mono\" style=\"flex:1\" value=\"/Users/you/workspace\"><button class=\"btn btn-primary\" disabled>保存<\/button><\/div><div class=\"faint\" style=\"margin-top:4px\">直下のディレクトリのうち、Claude のセッションがあるものをプロジェクトとして登録します。<\/div><\/section>\n    <section><h2 class=\"h2\">ツール<\/h2><div class=\"grid2\"><label class=\"field\">tmux のパス<input class=\"input mono\" value=\"/opt/homebrew/bin/tmux\"><\/label><label class=\"field\">code のパス<input class=\"input mono\" value=\"/usr/local/bin/code\"><\/label><label class=\"field\">claude のパス<input class=\"input mono\" value=\"/Users/you/.local/bin/claude\"><\/label><\/div><\/section>\n    <section><h2 class=\"h2\">保持期間<\/h2><div class=\"muted\">Claude Code は既定で 30 日を過ぎた会話の本文を消します。<\/div><\/section>\n  <\/div>`;\n}\n\nconst PAGES = { home: pageHome, projects: pageProjects, project: pageProject, sessions: pageSessions, session: pageSession, settings: pageSettings };\nconst PAGE_NAMES = { home: 'ホーム', projects: 'プロジェクト一覧', project: 'プロジェクト', sessions: 'セッション一覧', session: 'セッション', settings: '設定' };\n\nconst shell = document.getElementById('shell');\nconst frame = document.getElementById('pc-frame');\nfunction render() {\n  frame.style.width = '100%';\n  shell.dataset.sidebar = S.side === 'collapsed' ? 'collapsed' : '';\n  if (S.side !== 'collapsed') delete shell.dataset.sidebar;\n  shell.dataset.vMode = S.mode; shell.dataset.vLogo = S.logo; shell.dataset.hv = S.hv;\n  shell.innerHTML = sidebar() + header() + `<main class=\"main\"><div class=\"main-inner\">${PAGES[S.page]()}<\/div><\/main>`;\n  document.querySelectorAll('[data-set]').forEach((b) => { const [k, v] = b.dataset.set.split(':'); b.setAttribute('aria-pressed', String(S[k] === v)); });\n  const newOnly = S.mode !== 'new';\n  document.querySelectorAll('[data-set^=\"parent:\"],[data-set^=\"reserve:\"],[data-set^=\"right:\"],[data-set^=\"logo:\"]').forEach((b) => { b.disabled = newOnly; });\n  document.querySelectorAll('[data-set^=\"reserve:\"]').forEach((b) => { if (S.parent === 'inline') b.disabled = true; });\n  requestAnimationFrame(guide);\n}\nfunction guide() {}\n// サイドバーの開閉は列の幅が動くので、動いている間も線を追う。\nfunction follow(ms) { const end = performance.now() + ms; const tick = () => { guide(); if (performance.now() < end) requestAnimationFrame(tick); }; tick(); }\n\ndocument.addEventListener('click', (e) => {\n  const set = e.target.closest('[data-set]');\n  if (set) { const [k, v] = set.dataset.set.split(':'); S[k] = v; render(); if (k === 'side') follow(600); return; }\n  if (e.target.closest('[data-toggle-side]')) { S.side = S.side === 'open' ? 'collapsed' : 'open'; render(); follow(600); return; }\n  const go = e.target.closest('[data-go]');\n  if (go && shell.contains(go)) { e.preventDefault(); S.page = go.dataset.go; if (go.dataset.pid) S.pid = go.dataset.pid; if (go.dataset.sid) S.sid = go.dataset.sid; if (S.page === 'session' && !go.dataset.sid) S.sid = 's1'; render(); }\n});\nwindow.addEventListener('resize', guide);\nrender();\n})();\n<\/script><\/body><\/html>";
function show(page){ document.querySelectorAll('[data-page]').forEach(b=>b.setAttribute('aria-pressed', String(b.dataset.page===page)));
  document.querySelectorAll('iframe').forEach(f=>{ const cfg = JSON.stringify({hv:f.dataset.v,page,pid:'hangar',sid:'s1'}); f.srcdoc = APP.replace('<body>', '<body><script>window.__CFG=' + cfg + '<' + '/script>'); }); }
document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>show(b.dataset.page));
show('home');
