<h2>「読み込みが終わった」の合図を強く：6 通り（その後は F4 で開く）</h2>
<p class="subtitle">どの案も、<b>合図 → F4（光の色が満ちる）→ 差し替え → UI のガラスが浮かぶ</b>、の順です。F4 の部分は全案で同じです。<br>
合図には、待っている間のループが<b>一度もしない動き</b>（止まる・色が変わる・光る・弾む）を使って、「終わった」がはっきり分かるようにしています。<br>
上の段で、合図の長さとロゴの大きさを切り替えられます。今のロゴは窓 1400×900 に対して 96px で、合図が弱く見える一因でもあります。気になる案をクリックして、感想は端末へどうぞ。</p>

<script>
(function(){
  const INK = '#1c1b2e', BLUE = '#4a63e8', HAZE = '#e2e7ff', CHEV = '#e8e6e1', GREEN = '#3fb58a';
  const CURSORS = ['#ffb86b', '#e5533d', '#b5b2c4', '#ffb86b', '#ffb86b', '#b5b2c4'];
  const hex = h => [1,3,5].map(i => parseInt(h.slice(i, i+2), 16));
  const mix = (a, b, t) => '#' + hex(a).map((v, i) => Math.round(v + (hex(b)[i] - v) * t).toString(16).padStart(2, '0')).join('');
  const clamp = t => Math.max(0, Math.min(1, t));
  const eOut = t => 1 - Math.pow(1 - t, 3);
  const eIn = t => t * t * t;
  const R = .85, K = .13 * 62, UP = .035 * 72;
  const geo = u => { const g = (1 - Math.pow(R, u)) / (1 - R); return { x: K * g, y: -UP * g, s: Math.pow(R, u) }; };
  const W = 6.3, Z = 2.4, PER = 1.6, H = .34, SL = .34, WV = .07;
  const pendulum = (d, tau, landed) => { const A = 5; if (!landed) return { dy: -34 * (1 - eOut(d)), ang: A * eOut(d), op: eOut(d) }; return { dy: 0, ang: A * Math.exp(-Z * tau) * Math.cos(W * tau), op: 1 }; };
  // boot-frames.js の frameOf をそのまま写したもの。
  function frameOf(T) {
    const n = Math.floor(T / PER), f = (T / PER) % 1, tSec = f * PER, out = [], landT = H * .92 * PER;
    for (let k = 0; k <= 4; k++) {
      const id = n - k, local = clamp((f - H - k * WV) / SL);
      let u = k + eOut(local), dy = 0, op = 1, ang = 0;
      const damp = 1 - Math.min(u, 3) / 5, B = 3.2 * damp, endT = (H + k * WV + SL) * PER;
      if (local > 0 && local < 1) ang = -B * Math.sin(local * Math.PI);
      else if (local >= 1) { const tau = tSec - endT; ang = B * .7 * Math.exp(-Z * tau) * Math.sin(W * tau); }
      else if (k > 0) { const tau = tSec + PER - (endT - WV * PER); ang = B * .7 * Math.exp(-Z * tau) * Math.sin(W * tau); }
      if (k === 0) {
        const landed = tSec >= landT, d = clamp(tSec / landT), tau = Math.max(0, tSec - landT), e = pendulum(d, tau, landed);
        if (f < H) { dy = e.dy; op = e.op; ang = e.ang; } else { ang += pendulum(1, tau, true).ang * (local < 1 ? 1 : Math.exp(-3 * (tSec - endT))); }
      }
      if (u > 3) op *= clamp(1 - (u - 3) / .8);
      if (op <= 0) continue;
      out.push({ u, id, ang, dy, op });
    }
    return out.sort((p, q) => q.u - p.u);
  }
  const P = [0,1,2,3].map(geo);
  let bx = [Infinity, Infinity, -Infinity, -Infinity];
  for (const p of P) bx = [Math.min(bx[0], p.x - 31 * p.s), Math.min(bx[1], p.y - 3 * p.s), Math.max(bx[2], p.x + 31 * p.s), Math.max(bx[3], p.y + 69 * p.s)];
  const SC = Math.min(70 / (bx[2] - bx[0]), 66 / (bx[3] - bx[1])), TX = 50 - SC * (bx[0] + bx[2]) / 2, TY = 51 - SC * (bx[1] + bx[3]) / 2;
  const R0 = geo(-1.1), R1 = geo(3.6);
  const DEFS = `<defs><linearGradient id="RG" gradientUnits="userSpaceOnUse" x1="${R0.x}" y1="0" x2="${R1.x}" y2="0"><stop offset="0" stop-color="${INK}" stop-opacity="0"/><stop offset=".2" stop-color="${INK}"/><stop offset=".4" stop-color="${INK}"/><stop offset="1" stop-color="${HAZE}"/></linearGradient></defs>`;
  const RAIL = `<path d="M${R0.x} ${R0.y - 1}L${R1.x} ${R1.y - 1}" stroke="url(#RG)" stroke-width="2.6" stroke-linecap="round"/>`;
  const RAIL_LEN = Math.hypot(R1.x - R0.x, R1.y - R0.y);
  const colors = (t, cur) => ({ ink: mix(INK, HAZE, t), blue: mix(BLUE, HAZE, t), chev: mix(CHEV, HAZE, t * .6), cur: mix(cur, HAZE, t * .45), r: mix('#ff6a55', HAZE, t), y: mix('#ffc34d', HAZE, t), g: mix('#3fb58a', HAZE, t) });
  const item = (c, curOp) => `<path d="M0 10v-4a4.2 4.2 0 1 0-4.2-4.2" fill="none" stroke="${c.ink}" stroke-width="2.8" stroke-linecap="round"/><rect x="-30" y="29" width="60" height="40" rx="5" fill="${c.ink}"/>`
    + `<path d="M0 10L-31 31H31Z" fill="none" stroke="${c.blue}" stroke-width="4" stroke-linejoin="round"/>`
    + `<circle cx="-23" cy="37" r="2" fill="${c.r}"/><circle cx="-16.5" cy="37" r="2" fill="${c.y}"/><circle cx="-10" cy="37" r="2" fill="${c.g}"/>`
    + `<path d="M-23 46l7 5.5-7 5.5" fill="none" stroke="${c.chev}" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/><rect x="-12" y="55" width="13" height="4" rx="2" fill="${c.cur}" opacity="${curOp}"/>`;
  const draw = c => {
    const p = geo(c.u), t = clamp(c.u / 3) * .86 + Math.max(0, c.u - 3) * .1;
    const cur = c.cur || CURSORS[((c.id % 6) + 6) % 6];
    return `<g transform="translate(${p.x.toFixed(2)} ${(p.y + (c.dy || 0)).toFixed(2)}) scale(${p.s.toFixed(4)})" opacity="${c.op.toFixed(3)}"><g transform="rotate(${c.ang.toFixed(2)})">${item(colors(Math.min(t, .95), cur), c.curOp == null ? 1 : c.curOp)}</g></g>`;
  };
  const scene = (cards, extra = '') => `${DEFS}<g transform="translate(${TX} ${TY}) scale(${SC})">${RAIL}${extra}${cards.slice().sort((p, q) => q.u - p.u).map(draw).join('')}</g>`;

  const BG = '#eef1f7';
  const eInOut = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
  const lerp = (a, b, t) => a + (b - a) * t;
  const bump = (t, a, b) => { const q = clamp((t - a) / (b - a)); return Math.sin(Math.PI * q); };
  const others = (Tb, tb) => frameOf(Tb + Math.min(tb, .5)).filter(c => c.id !== Math.round(Tb / PER));
  const lastCard = (Tb, tb, drop) => { const d = clamp(tb / drop), e = pendulum(d, (tb - drop) * .5 / drop, tb >= drop); return { u: 0, id: Math.round(Tb / PER), ang: e.ang, dy: e.dy, op: e.op }; };
  const css = (el, o) => { for (const k in o) el.style[k] = o[k]; };
  const mk = (parent, cls, html = '') => { const d = document.createElement('div'); if (cls) d.className = cls; d.innerHTML = html; parent.appendChild(d); return d; };

  // 札の絵。点の色と大きさ、カーソルの色を上書きできるようにしたもの。
  const item2 = (c, o) => {
    const dc = o.dots || [c.r, c.y, c.g], dr = o.dr || 1;
    const glow = o.glow ? `<rect x="-30" y="29" width="60" height="40" rx="5" fill="none" stroke="${GREEN}" stroke-width="${(2.5 * o.glow).toFixed(2)}" opacity="${(.55 * o.glow).toFixed(2)}"/>` : '';
    return `<path d="M0 10v-4a4.2 4.2 0 1 0-4.2-4.2" fill="none" stroke="${c.ink}" stroke-width="2.8" stroke-linecap="round"/><rect x="-30" y="29" width="60" height="40" rx="5" fill="${c.ink}"/>${glow}`
      + `<path d="M0 10L-31 31H31Z" fill="none" stroke="${o.blue || c.blue}" stroke-width="4" stroke-linejoin="round"/>`
      + [-23, -16.5, -10].map((x, i) => `<circle cx="${x}" cy="37" r="${(2 * dr).toFixed(2)}" fill="${dc[i]}"/>`).join('')
      + `<path d="M-23 46l7 5.5-7 5.5" fill="none" stroke="${c.chev}" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/><rect x="-12" y="55" width="13" height="4" rx="2" fill="${o.cur || c.cur}"/>`;
  };
  const draw2 = c => {
    const p = geo(c.u), t = clamp(c.u / 3) * .86 + Math.max(0, c.u - 3) * .1;
    const cl = colors(Math.min(t, .95), CURSORS[((c.id % 6) + 6) % 6]), fade = x => mix(x, HAZE, Math.min(t, .95) * .5);
    const o = { ...c.o }; if (o.dots) o.dots = o.dots.map(fade); if (o.cur) o.cur = fade(o.cur);
    return `<g transform="translate(${p.x.toFixed(2)} ${(p.y + (c.dy || 0)).toFixed(2)}) scale(${p.s.toFixed(4)})" opacity="${c.op.toFixed(3)}"><g transform="rotate(${c.ang.toFixed(2)})">${item2(cl, o)}</g></g>`;
  };
  const scene2 = (cards, extra = '') => `${DEFS}<g transform="translate(${TX} ${TY}) scale(${SC})">${RAIL}${extra}${cards.slice().sort((p, q) => q.u - p.u).map(draw2).join('')}</g>`;
  const railLight = (p, color = '#9fb0ff') => { if (p <= 0 || p >= 1) return ''; const seg = RAIL_LEN * .3, off = seg - (RAIL_LEN + seg) * eOut(p); return `<path d="M${R0.x} ${R0.y - 1}L${R1.x} ${R1.y - 1}" stroke="${color}" stroke-width="3.4" stroke-linecap="round" stroke-dasharray="${seg.toFixed(2)} ${(RAIL_LEN * 2).toFixed(2)}" stroke-dashoffset="${off.toFixed(2)}"/>`; };

  // ロゴの置き場所。窓の真ん中に、ロゴ・名前・文言の順に積む。
  const place = S => { const top = 450 - (S + 76) / 2; return { S, left: 700 - S / 2, top, wTop: top + S + 6, stTop: top + S + 40, cx: 700, cy: top + S * .55 }; };
  const CHECK = p => `<svg width="14" height="14" viewBox="0 0 14 14" style="overflow:visible"><path d="M2.5 7.4l3 3 6-6.6" fill="none" stroke="${GREEN}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="14" stroke-dashoffset="${(14 * (1 - p)).toFixed(2)}"/></svg>`;

  // 合図の各案。k は 0→1 の進み、tb は合図が始まってからの秒数。
  // 返す値：cards（札）、extra（竿の上の足し絵）、scale / lift（ロゴ全体）、fx（画面の上の足し絵を描く関数）、glow（ロゴの奥の灯り 0〜1）。
  const OPTIONS = [
    { key: 'k1', title: '最後の一枚が掛かって、ポンと弾む', len: .45,
      desc: '新しい札が掛かって 4 枚の原図になった瞬間、<b>ロゴ全体がポンと一度弾む</b>（少し膨らんで戻る）。文言も「✓ 準備ができました」に弾んで替わる。',
      beat: (Tb, tb, k, len) => { const land = len * .5; return { cards: [...others(Tb, tb), lastCard(Tb, tb, land)], scale: 1 + .12 * bump(tb, land * .9, land * .9 + len * .45) - .03 * bump(tb, land * .9 + len * .3, len) }; } },
    { key: 'k2', title: '信号がそろって緑に灯る', len: .5,
      desc: '全部の札の赤・黄・緑の三点が、<b>奥から手前へ波のように順に緑へ灯る</b>（少し膨らんで光る）。カーソルも緑に。「全部そろった」の見立て。最後の一枚も掛かる。',
      beat: (Tb, tb, k, len) => {
        const land = len * .4, cards = [...others(Tb, tb), lastCard(Tb, tb, land)];
        return { cards: cards.map(c => { const k0 = clamp((tb - (3 - Math.min(c.u, 3)) * len * .13 - len * .18) / (len * .22)); if (k0 <= 0) return c;
          const g = mix('#ff6a55', GREEN, k0); return { ...c, o: { dots: [g, mix('#ffc34d', GREEN, k0), GREEN], dr: 1 + .45 * bump(k0, 0, 1) + .1 * k0, cur: mix(CURSORS[((c.id % 6) + 6) % 6], GREEN, k0), glow: bump(k0, 0, 1) } }; }) };
      } },
    { key: 'k3', title: '波紋が画面に広がる', len: .5,
      desc: 'ロゴが小さく弾み、そこから<b>光の輪が二重に画面の端まで広がる</b>（ソナーの「ピン」）。輪を追うように F4 の光が満ちるので、合図と開く演出がつながる。',
      beat: (Tb, tb, k, len) => ({ cards: [...others(Tb, tb), lastCard(Tb, tb, len * .35)], scale: 1 + .07 * bump(tb, len * .3, len * .7),
        rings: [0, .18].map(d => clamp((tb - len * (.32 + d)) / (len * .9))) }) },
    { key: 'k4', title: 'カチッと揃って、竿に光が走る', len: .45,
      desc: '最後の一枚が素早く掛かり、<b>揺れが一斉にピタッと止まって</b>ロゴが一瞬沈んで戻る（「カチッ」）。止まった竿を光が一筋走る。',
      beat: (Tb, tb, k, len) => { const land = len * .3, snap = clamp((tb - land) / (len * .12));
        const cards = [...others(Tb, tb), lastCard(Tb, tb, land)].map(c => ({ ...c, ang: c.ang * (1 - snap) }));
        return { cards, scale: 1 - .05 * bump(tb, land, land + len * .15) + .02 * bump(tb, land + len * .12, land + len * .3), extra: railLight(clamp((tb - land - len * .1) / (len * .55))) }; } },
    { key: 'k5', title: '一斉に揺れて、拍手', len: .55,
      desc: '最後の一枚が掛かると、<b>4 枚が一斉に大きく一度揺れて</b>止まる。ばらばらに揺れていた札がそろうので、「締まった」が分かる。',
      beat: (Tb, tb, k, len) => { const land = len * .3, s = tb - land;
        const swing = s < 0 ? 0 : 9 * Math.exp(-4.5 * s / len) * Math.sin(Math.PI * 2 * s / (len * .75));
        const cards = [...others(Tb, tb), lastCard(Tb, tb, land)].map(c => ({ ...c, ang: c.ang * (1 - clamp(s / (len * .2))) + swing * (1 - Math.min(c.u, 3) / 6) }));
        return { cards }; } },
    { key: 'k6', title: '灯りがともって、そのまま満ちる', len: .5,
      desc: '最後の一枚が掛かると、ロゴが少し持ち上がり、<b>ロゴの奥に青い灯りがパッとともる</b>（一度強く光って落ち着く）。F4 の光はその灯りから広がるので、「ともる → 部屋を満たす」の一続きになる。',
      beat: (Tb, tb, k, len) => { const land = len * .35, g = clamp((tb - land) / (len * .2));
        return { cards: [...others(Tb, tb), lastCard(Tb, tb, land)], lift: -10 * eOut(clamp((tb - land) / (len * .5))), glow: g <= 0 ? 0 : .8 + .5 * bump(g, 0, 1) * (tb < land + len * .3 ? 1 : 0) + .0 }; } },
  ];

  const BLOOM = .4, ENTER = .5, HOLD = 1.4;
  const opt = { ready: 1.1, k: 1, logo: 96, cols: 'one' };
  let speed = 1, clock = 0, last = performance.now();
  const ROWDOT = ['#3fb58a', '#3fb58a', '#b5b2c4', '#ffb86b', '#3fb58a', '#b5b2c4'];
  const LIGHTS = [{ x: 28, c: '#ff5f57' }, { x: 48, c: '#febc2e' }, { x: 68, c: '#28c840' }];
  const uiHtml = `<div class="aura"></div><div class="p side"><div class="brand"><i></i>Hangar</div>${[80, 62, 72, 55, 68].map(w => `<div class="it" style="width:${w}%"></div>`).join('')}</div><div class="p head"></div>`
    + ROWDOT.map((c, i) => `<div class="p row" style="top:${64 + i * 66}px"><b style="background:${c}"></b><div class="bars"><span style="width:${[34, 28, 40, 25, 31, 36][i]}%"></span><span style="width:${[18, 22, 15, 20, 17, 24][i]}%;opacity:.6"></span></div></div>`).join('');
  const root = document.getElementById('fb');
  const tiles = OPTIONS.map(o => {
    const el = document.createElement('div');
    el.className = 'option'; el.dataset.choice = o.key; el.setAttribute('onclick', 'toggleSelect(this)');
    el.innerHTML = `<div class="dhead"><div class="letter">${o.key.toUpperCase()}</div><h3>${o.title}</h3></div>
      <div class="boot"><div class="stage"><div class="ui">${uiHtml}</div>
        <div class="bk"><div class="glow" style="position:absolute;inset:0"></div><div class="aura"></div></div>
        <div class="layer"><svg class="logo" viewBox="0 0 100 100" aria-hidden="true"></svg><div class="w">Hangar</div><div class="st"></div></div>
        <div class="fx"><svg width="1400" height="900" style="position:absolute;inset:0"></svg></div>
        <div class="chrome">${LIGHTS.map(L => `<i style="left:${L.x - 6}px;background:${L.c}"></i>`).join('')}</div></div><div class="chip"></div></div>
      <div class="rd"></div><p class="desc">${o.desc}</p>`;
    root.appendChild(el);
    const q = s => el.querySelector(s);
    return { o, box: q('.boot'), stage: q('.stage'), ui: q('.ui'), bk: q('.bk'), glow: q('.bk .glow'), aura: q('.bk .aura'), layer: q('.layer'), svg: q('svg.logo'), w: q('.layer .w'), st: q('.layer .st'), fx: q('.fx svg'), chip: q('.chip'), rd: q('.rd'),
      u: { aura: q('.ui .aura'), side: q('.ui .side'), head: q('.ui .head'), rows: [...el.querySelectorAll('.ui .row')] } };
  });
  const fit = () => tiles.forEach(t => { const w = t.box.clientWidth || 700; t.stage.style.transform = `scale(${w / 1400})`; });
  if (window.ResizeObserver) new ResizeObserver(fit).observe(root); fit();

  function uiFloat(u, p) {
    const e = d => eOut(clamp((p - d) / .62));
    let v = e(0); css(u.side, { opacity: v, transform: `translateX(${-28 * (1 - v)}px)` });
    v = e(.06); css(u.head, { opacity: v, transform: `translateY(${-14 * (1 - v)}px)` });
    u.rows.forEach((r, i) => { v = e(.1 + i * .045); css(r, { opacity: v, transform: `translateY(${18 * (1 - v)}px)` }); });
  }

  function render(t) {
    const { o } = t, P = place(opt.logo), Tb = Math.ceil(opt.ready / PER - 1e-9) * PER, len = o.len * opt.k;
    const beatEnd = Tb + len, bloomEnd = beatEnd + BLOOM, uiAt = bloomEnd + .2, total = uiAt + ENTER + HOLD, c = clock % total;
    css(t.svg, { left: P.left + 'px', top: P.top + 'px', width: P.S + 'px', height: P.S + 'px', transformOrigin: '50% 60%' });
    css(t.w, { top: P.wTop + 'px' }); css(t.st, { top: P.stTop + 'px' });
    const onBoot = c < uiAt;
    t.ui.style.display = onBoot ? 'none' : ''; [t.bk, t.layer, t.fx].forEach(x => { x.style.display = onBoot ? '' : 'none'; });
    let chip = '起動画面', st = 'サーバを起動しています', check = null, fxHtml = '';
    let b = { cards: null }, glow = 0, bloom = 0;
    if (c < Tb) { b.cards = frameOf(c); if (c >= 3 && c < opt.ready) st = `まだ起動しています（${Math.floor(c)} 秒）`; }
    else if (c < uiAt) {
      const tb = Math.min(c - Tb, len); b = o.beat(Tb, tb, tb / len, len);
      if (c >= beatEnd) { const tb2 = Math.min(c - Tb, len + .5); b = { ...o.beat(Tb, Math.min(tb2, len), 1, len), cards: o.beat(Tb, Math.min(tb2, len + .3), 1, len).cards }; }
      st = '準備ができました'; check = clamp((c - Tb) / .3);
      bloom = clamp((c - beatEnd) / BLOOM);
      glow = b.glow || 0;
      if (b.rings) fxHtml = b.rings.map(r => r <= 0 || r >= 1 ? '' : `<circle cx="${P.cx}" cy="${P.cy}" r="${(P.S * .45 + 900 * eOut(r)).toFixed(1)}" fill="none" stroke="${BLUE}" stroke-width="${(3 * (1 - r) + .5).toFixed(2)}" opacity="${(.7 * (1 - r)).toFixed(3)}"/>`).join('');
      if (c >= uiAt - .2) chip = '差し替え中（起動画面の最後の絵のまま）';
    } else chip = 'UI 側';
    if (onBoot) {
      t.svg.innerHTML = scene2(b.cards, b.extra || '');
      const sc = (b.scale || 1) * (P.S / 96 > 1 ? 1 : 1);
      t.svg.style.transform = `translateY(${(b.lift || 0) * P.S / 96}px) scale(${sc.toFixed(4)})`;
      // F4：ロゴの奥から光が円く滲みながら満ち、ロゴと文字は少し浮きながら溶ける。
      const q = eOut(bloom), R = lerp(P.S * .5, 1900, q), m = `radial-gradient(circle at ${P.cx}px ${P.cy}px, #000 ${(R * .55).toFixed(0)}px, transparent ${R.toFixed(0)}px)`;
      css(t.aura, { webkitMaskImage: m, maskImage: m, opacity: bloom > 0 ? clamp(bloom / .3) : 0 });
      const fade = 1 - eIn(bloom);
      css(t.layer, { opacity: fade.toFixed(3), transform: `translateY(${-16 * eIn(bloom)}px)` });
      const gl = glow * (1 - clamp(bloom / .6));
      t.glow.style.background = gl > 0 ? `radial-gradient(circle at ${P.cx}px ${P.cy}px, rgba(120,146,255,${(.55 * Math.min(gl, 1.3)).toFixed(3)}), rgba(159,176,255,${(.25 * Math.min(gl, 1.3)).toFixed(3)}) ${(P.S * .5).toFixed(0)}px, transparent ${(P.S * (1.1 + .3 * gl)).toFixed(0)}px)` : 'none';
      t.fx.innerHTML = fxHtml;
      const html = check == null ? st : `${CHECK(check)}<span>${st}</span>`;
      if (t.st.dataset.h !== html) { t.st.innerHTML = html; t.st.dataset.h = html; }
    } else uiFloat(t.u, clamp((c - uiAt) / ENTER));
    if (t.chip.textContent !== chip) t.chip.textContent = chip;
    t.rd.textContent = `準備 ${opt.ready.toFixed(1)}s → 境目 ${Tb.toFixed(1)}s → 合図 ${len.toFixed(2)}s → 光が満ちる ${BLOOM}s → 差し替え 0.2s → UI の入場 ${ENTER}s（出揃い ${(uiAt + ENTER).toFixed(2)}s）`;
  }
  function loop(now) { clock += (now - last) / 1000 * speed; last = now; tiles.forEach(render); requestAnimationFrame(loop); }
  requestAnimationFrame(loop);

  document.querySelectorAll('.ctl [data-g]').forEach(g => g.querySelectorAll('button').forEach(b => b.addEventListener('click', () => {
    g.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
    const v = b.dataset.v; opt[g.dataset.g] = isNaN(+v) ? v : +v;
    if (g.dataset.g === 'cols') { root.classList.toggle('two', v === 'two'); setTimeout(fit, 0); } else clock = 0;
  })));
  const slow = document.getElementById('slow');
  slow.addEventListener('click', () => { speed = speed === 1 ? .3 : 1; slow.classList.toggle('on', speed !== 1); });
  document.getElementById('again').addEventListener('click', () => { clock = 0; });
})();
</script>
