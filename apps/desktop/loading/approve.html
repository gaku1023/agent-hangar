<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>Hangar</title>
    <!-- 承認の窓。殻が自分の窓（approve）で開く、殻に同梱した頁で、サーバを通らない。文と動きは approve.js にある。 -->
    <style>
      :root { --bg: #ffffff; --bg-2: #f5f6fa; --ink: #1c1b2e; --ink-2: #5f5e78; --ink-3: #8a89a0; --line: #e4e6ef; --accent: #4a63e8; --error: #b3261e; --ok: #2b7048; --warn: #9a5b00; --add: #e8f5ec; --del: #fbeaea; }
      html, body { height: 100%; margin: 0; }
      body { background: var(--bg); color: var(--ink); font: 13px/1.55 'Inter Variable', 'Segoe UI', 'Hiragino Sans', sans-serif; -webkit-font-smoothing: antialiased; }
      #root { display: flex; flex-direction: column; height: 100%; }
      header { padding: 16px 20px 6px; }
      header.warn h1::before { content: '!'; display: inline-grid; place-items: center; width: 18px; height: 18px; margin-right: 8px; border-radius: 50%; background: #fdf0d8; color: var(--warn); font-size: 12px; vertical-align: 1px; }
      h1 { margin: 0; font-size: 15px; font-weight: 650; }
      main { flex: 1; min-height: 0; overflow-y: auto; padding: 4px 20px 12px; }
      footer { display: flex; align-items: center; gap: 8px; padding: 12px 20px; border-top: 1px solid var(--line); }
      .spacer { flex: 1; }
      .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 10px; }
      .tabs button { appearance: none; border: 0; background: none; padding: 8px 10px; font: inherit; color: var(--ink-2); border-bottom: 2px solid transparent; cursor: pointer; }
      .tabs button[aria-selected='true'] { color: var(--ink); border-bottom-color: var(--accent); font-weight: 600; }
      .what { display: grid; gap: 6px; }
      .w { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 10px; align-items: start; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; }
      .w .k { display: grid; place-items: center; width: 22px; height: 22px; border-radius: 6px; background: var(--bg-2); font-weight: 700; }
      .w .k.create { background: var(--add); color: var(--ok); }
      .w .k.modify { background: #fdf3df; color: var(--warn); }
      .w .k.remove { background: var(--del); color: var(--error); }
      .w .tg { display: inline-block; padding: 0 6px; margin-right: 4px; border-radius: 999px; background: var(--bg-2); color: var(--ink-2); font-family: inherit; font-size: 11px; }
      .w .s { color: var(--ink-2); }
      .mono, .diff, .cmd { font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; font-size: 12px; overflow-wrap: anywhere; }
      .faint { color: var(--ink-3); font-size: 12px; white-space: nowrap; }
      .muted { color: var(--ink-2); }
      .pre { white-space: pre-wrap; }
      .diff { border-radius: 10px; background: var(--bg-2); padding: 8px 0; margin-bottom: 8px; white-space: pre-wrap; }
      .diff > div { padding: 0 12px; }
      .diff .p { color: var(--ink-2); font-weight: 600; padding-bottom: 4px; }
      .diff .a { background: var(--add); }
      .diff .d { background: var(--del); }
      .diff .c { color: var(--ink-2); }
      .mask { display: inline-block; width: 12em; height: 1em; vertical-align: -2px; border-radius: 2px; background: var(--ink); }
      .cmd { margin: 6px 0 0; padding: 10px 12px; border-radius: 10px; background: var(--bg-2); white-space: pre-wrap; }
      .kv { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 4px 14px; margin: 14px 0 0; padding-top: 12px; border-top: 1px solid var(--line); }
      .kv dt { color: var(--ink-3); }
      .kv dd { margin: 0; overflow-wrap: anywhere; }
      .strip { display: flex; gap: 10px; padding: 12px 14px; border-radius: 10px; }
      .strip .ic { flex: none; display: grid; place-items: center; width: 20px; height: 20px; border-radius: 50%; font-weight: 700; }
      .strip.ok { background: var(--add); }
      .strip.ok .ic { background: var(--ok); color: #fff; }
      .strip.danger { background: var(--del); }
      .strip.danger .ic { background: var(--error); color: #fff; }
      .btn { appearance: none; border: 1px solid var(--line); background: #fff; color: var(--ink); border-radius: 999px; padding: 7px 16px; font: inherit; cursor: pointer; }
      .btn:disabled { opacity: 0.55; cursor: default; }
      .btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
      .btn-danger { background: var(--error); border-color: var(--error); color: #fff; }
      .btn:focus-visible, .tabs button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
      .spin { display: inline-block; width: 12px; height: 12px; border: 2px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; vertical-align: -2px; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { .spin { animation: none; } }
    </style>
  </head>
  <body>
    <div id="root"><main><p class="muted">…</p></main></div>
    <script type="module" src="./approve.js"></script>
  </body>
</html>
