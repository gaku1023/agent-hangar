[package]
name = "hangar-desktop"
version = "0.1.0"
description = "agent-hangar desktop shell"
edition = "2021"
rust-version = "1.80"

[lib]
name = "hangar_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = [] }
tauri-plugin-deep-link = "2.4.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
libc = "0.2"

[dev-dependencies]
tempfile = "3"

# サイズ最適化。
# spike 08 と同じ設定で 4MB の .app になった。
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
