[package]
name = "hangar-desktop"
version = "0.1.0"
description = "agent-hangar desktop shell"
edition = "2021"
rust-version = "1.80"

[lib]
name = "hangar_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = [] }
tauri-plugin-deep-link = "2.4.10"
# プロジェクトを作るダイアログの「ほかの場所を選ぶ…」で、macOS のフォルダ選択を開く（lib.rs の pick_folder）。
# 頁からは pick_folder の命令だけを呼ばせ、プラグインの JS の権限は与えない。
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"

# 信号と setsid は POSIX だけにある。Windows では使わないので、依存ごと外す。
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# トラックパッドの「指を離した」瞬間を読むためだけに使う。
# WebKit の手勢が使っているのと同じ NSEvent の位相を、こちらでも読む。
[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSEvent"] }
# 入力待ちを macOS の通知で知らせ、押された通知からそのセッションへ戻るために使う（src/notify.rs）。
# tauri-plugin-notification は押された通知を受け取れない（デスクトップでは押しても何も返らない）ので、
# UNUserNotificationCenter を直に呼ぶ。objc2 と objc2-foundation は Tauri が既に使っている版をそのまま使う。
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSBundle", "NSError", "NSSet"] }
objc2-user-notifications = { version = "0.3", default-features = false, features = ["std", "block2", "UNUserNotificationCenter", "UNNotificationContent", "UNNotificationRequest", "UNNotificationResponse", "UNNotification", "UNNotificationTrigger", "UNNotificationSound", "UNNotificationSettings"] }

# 入力待ちを Windows のトーストで知らせ、押されたトーストからそのセッションへ戻るために使う（src/notify.rs）。
# tauri-plugin-notification は Windows でも押されたトーストを返さないので、WinRT のトーストと COM の口を直に使う。
# 版は Tauri（tao、wry）が Windows で既に使っている windows 0.61 に揃える。
# windows-core は #[implement] が名指しで使うので、直の依存に置く。
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Data_Xml_Dom", "Foundation", "UI_Notifications", "Win32_Foundation", "Win32_System_Com", "Win32_Security", "Win32_System_Registry", "Win32_UI_Notifications"] }
windows-core = "0.61"
# Windows では、子をジョブオブジェクトに入れて孫ごと止め（src/winjob.rs）、外のアプリはジョブの外で起こす（src/breakaway.rs）。
# 失敗の札の言語と OS の版も、ここから読む（src/bootfail.rs）。
# 版は Tauri が既に引いているものに合わせ、新しい版を持ち込まない。
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Registry", "Win32_System_Threading"] }

[dev-dependencies]
tempfile = "3"

# サイズ最適化。
# spike 08 と同じ設定で 4MB の .app になった。
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
